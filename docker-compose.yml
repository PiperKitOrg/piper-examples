name: piper-playground

services:
  postgres:
    image: pgvector/pgvector:pg18
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: playground
      POSTGRES_DB: postgres
    volumes:
      # PG 18+ images expect the volume at /var/lib/postgresql (not .../data).
      - postgres_data:/var/lib/postgresql
      - ./datasets/postgres:/datasets/postgres:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  mysql:
    image: mysql:8.4
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: playground
      MYSQL_USER: playground
      MYSQL_PASSWORD: playground
    volumes:
      - mysql_data:/var/lib/mysql
      - ./datasets/mysql:/datasets/mysql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: playground
      MONGO_INITDB_ROOT_PASSWORD: playground
    volumes:
      - mongo_data:/data/db
      - ./datasets/mongodb:/datasets/mongodb:ro
      - ./playground/import-sample.js:/datasets/import-sample.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--username", "playground", "--password", "playground", "--authenticationDatabase", "admin", "--eval", "db.adminCommand({ ping: 1 })"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  postgres_data:
  mysql_data:
  mongo_data:
