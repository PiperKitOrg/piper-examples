services:
  postgres:
    image: postgres:15
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: shop_source
      POSTGRES_USER: piper
      POSTGRES_PASSWORD: piper
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U piper -d shop_source"]
      interval: 5s
      timeout: 5s
      retries: 10

  mysql:
    image: mysql:8.4
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: shop_target
      MYSQL_USER: piper
      MYSQL_PASSWORD: piper
      MYSQL_ROOT_PASSWORD: root
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 20s
